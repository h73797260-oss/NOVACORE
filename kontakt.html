<head>

<header>

  <div class="logo">NOVACORE</div>

  </nav>

  <div class="menu-btn" id="menuBtn">☰</div>

</header>

<section class="contact-page">

  <div class="contact-wrapper">

    <div class="contact-info">

      <span class="contact-tag">KONTAKT</span>

      <h1>Schreib mir eine Nachricht.</h1>

      <p>Ich melde mich so schnell wie möglich zurück.</p>

    </div>

    <div class="contact-card">

      <form class="contact-form" id="contactForm">

        <input type="text" name="name" placeholder="Dein Name" required />
        <input type="email" name="email" placeholder="Deine E-Mail" required />
        <textarea name="message" placeholder="Deine Nachricht" required></textarea>

        <button type="submit">Nachricht senden</button>

        <p id="contactText"></p>

      </form>

    </div>

  </div>

</section>
